<!DOCTYPE html>
<html>
<head><title>TracheaAI Debug Console</title></head>
<body style="background:#000; color:#0f0; font-family:monospace; padding:20px;">
    <h1>TracheaAI Debug Console</h1>
    <div id="log"></div>
    <script>
        const log = (msg) => {
            const div = document.createElement('div');
            div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            document.getElementById('log').appendChild(div);
        };
        log('Starting Debug Check...');
        fetch('/api/scans').then(r => r.json()).then(d => log('API /api/scans: ' + d.length + ' scans found')).catch(e => log('API Error: ' + e));
        fetch('/scans.json').then(r => r.json()).then(d => log('Static scans.json: ' + d.length + ' scans found')).catch(e => log('Static Error: ' + e));
        log('Hostname: ' + window.location.hostname);
        log('Origin: ' + window.location.origin);
    </script>
</body>
</html>
